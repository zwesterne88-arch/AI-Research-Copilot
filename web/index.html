<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Research Copilot · 科研阅读工作台</title>
<link rel="stylesheet" href="/vendor/pdf_viewer.css"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/polish.css"><link rel="stylesheet" href="/refinement.css"></head>
<body>
<a class="skip-link" href="#viewer-container">跳至论文原文</a>
<div id="app"><aside id="sidebar" aria-label="论文与功能导航">
<div class="brand"><b class="brandmark">R<span>✦</span></b><div><strong>Research Copilot</strong><small>读懂研究，让思考有据</small></div><button id="collapse" aria-label="收起导航" title="收起导航 · [">‹</button></div>
<button class="primary import" id="import">＋ 导入论文</button><input hidden id="file" type="file" accept="application/pdf"><nav id="nav" aria-label="主导航"></nav>
<div class="library-head"><span>我的论文</span><span id="library-count"></span></div><input id="paper-search" placeholder="搜索标题或文件…" aria-label="搜索论文"><select id="paper-filter" aria-label="论文状态筛选"><option value="all">全部论文</option><option value="reading">有真实精读草稿</option><option value="unread">待精读</option><option value="ready">索引已就绪</option></select><div id="papers"></div><div class="sidebar-bottom"><span class="live-dot"></span> 本地资料库<small id="safe-label">论文 · 笔记 · 阅读进度</small></div></aside>
<main><header class="topbar"><button id="nav-toggle" aria-label="切换左侧导航" title="切换导航 · [">☰</button><div class="workspace-heading"><span class="eyebrow">RESEARCH WORKSPACE</span><h1 id="workspace-title">论文阅读</h1></div><div class="mode-switch" role="group" aria-label="阅读布局"><button data-layout="standard">标准阅读</button><button data-layout="assisted">辅助阅读</button><button data-layout="focus">专注阅读</button></div><button class="pill" id="mode-pill" title="接口设置">接口设置</button><button id="library-open">论文库</button><button id="assistant-toggle" aria-label="切换研究助手" title="切换助手 · ]">✧ 助手</button></header>
<section class="workspace" aria-label="论文阅读工作区"><div class="document-area"><div class="paper-header"><div class="file-icon">PDF</div><div class="paper-heading"><h2 id="paper-title">正在打开论文库…</h2><span id="paper-meta"></span></div><span id="card-indicator" class="badge"></span><a id="download" class="icon-button" title="下载当前原PDF" aria-label="下载当前原PDF">↓</a></div>
<div class="reader-toolbar" role="toolbar" aria-label="PDF阅读工具"><div><button id="prev" aria-label="上一页">‹</button><input id="page" type="number" min="1" value="1" aria-label="PDF物理页码"><span id="pages">/ —</span><button id="next" aria-label="下一页">›</button></div><div><button id="zoom-out" aria-label="缩小PDF">−</button><select id="zoom" aria-label="PDF缩放"><option value="page-width">适合宽度</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select><button id="zoom-in" aria-label="放大PDF">＋</button></div><span class="reader-tip">划选原文 · 翻译 / 术语 / 证据</span><span id="progress-text" class="reading-progress">—</span></div><div class="progress-track"><div id="progress-fill"></div></div>
<div class="pdf-stage"><div id="viewer-container" tabindex="0" aria-label="PDF正文，可选择文字"><div id="pdf-viewer" class="pdfViewer"></div></div><div id="pdf-loading" class="pdf-loading"><div class="loading-book"><span></span><span></span><span></span></div><p>正在打开原始PDF…</p></div></div><footer class="reader-footer"><span id="location-status" role="status">原文可选择、复制 · PDF物理页码</span><span id="selection-status">本地PDF.js</span></footer></div>
<div id="resize" tabindex="0" title="拖动或方向键调整助手宽度" role="separator" aria-label="调整助手宽度" aria-orientation="vertical"></div><aside class="assistant" aria-label="研究助手"><div class="assistant-heading"><span class="spark">✧</span><div><b>研究助手</b><small>沿着问题、方法与证据，读懂论文</small></div><button id="expand" title="加宽助手" aria-label="加宽助手">↔</button><button id="hide-assistant" title="收起助手 · ]" aria-label="收起助手">›</button></div><div id="tabs" class="tabs" role="tablist" aria-label="辅助阅读功能"></div><div id="panel" class="panel" role="tabpanel"></div><section id="source-drawer" aria-label="原文证据抽屉" hidden></section></aside><section id="compare-workspace" class="comparison-workspace" aria-label="全宽论文比较"><div id="comparison-panel"></div></section></section></main></div>
<div id="selection-menu" role="toolbar" aria-label="选段操作" hidden><span id="selection-count"></span><button id="translate-selection" class="primary">学术翻译</button><button id="explain-selection">解释术语</button><button id="save-selection">保存证据</button><button id="copy-selection" title="复制原文">复制</button><button id="dismiss-selection" aria-label="关闭选段菜单">×</button></div><div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="library-dialog" aria-labelledby="library-title"><div class="dialog-head"><div><span class="eyebrow">YOUR RESEARCH SHELF</span><h2 id="library-title">论文库</h2></div><button id="close-library" aria-label="关闭论文库">×</button></div><p>原始论文、处理状态与精读草稿，在这里继续阅读。</p><div class="library-controls"><input id="library-search" placeholder="搜索论文标题或文件名" aria-label="论文库搜索"><select id="library-filter" aria-label="论文库状态"><option value="all">全部论文</option><option value="reading">有真实精读草稿</option><option value="unread">待精读</option><option value="ready">索引已就绪</option></select></div><div id="library-grid"></div></dialog><script type="module" src="/app.js"></script></body></html>
