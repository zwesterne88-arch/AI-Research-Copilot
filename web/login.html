<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Research Copilot</title><link rel="stylesheet" href="/account.css"></head><body><main class="login-layout"><section class="login-story"><a class="brand" href="/">Research <span>Copilot</span></a><span class="eyebrow">YOUR RESEARCH, CONNECTED</span><h1>从读懂一篇论文，<br>到形成自己的思考。</h1><p>阅读原文，梳理研究脉络。<br>让翻译、问答和每一条证据，留在你的研究工作台。</p><div class="paper-art" aria-hidden="true"><strong>阅读 · 理解 · 探索</strong><i></i><i></i><i></i><i></i></div></section><section class="login-form-wrap"><form class="login-form"><h2 id="form-title">欢迎回来</h2><p class="muted" id="form-subtitle">登录账号，继续你的研究。</p><label class="field">账号<input name="username" autocomplete="username" required minlength="3" maxlength="40" placeholder="输入账号"></label><label class="field">密码<input name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入密码"></label><label class="field" id="repeat-field" hidden>确认密码<input name="repeat" type="password" autocomplete="new-password" placeholder="再次输入密码"></label><button class="primary" id="submit" type="submit">登录</button><div class="feedback" role="status" aria-live="polite"></div><div class="foot"><span id="switch-label">还没有账号？</span><button class="switch" type="button" id="switch">注册账号</button></div><p class="first-account" id="first-account" hidden>首次注册将接续本机已有资料；后续账号拥有独立的论文库。</p></form></section></main><script type="module" src="/login.mjs"></script></body></html>
